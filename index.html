<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Scheduler Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        .dark { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --border: #334155; }
        
        body { background-color: var(--bg); color: var(--text); transition: all 0.3s ease; }
        .card { background-color: var(--card); border-color: var(--border); @apply rounded-xl shadow-md p-6 border transition-all; }
        .input-field { background-color: var(--card); border-color: var(--border); color: var(--text); @apply rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none w-full border; }
        
        .scroll-area { max-height: 400px; overflow-y: auto; scrollbar-width: thin; }

        @keyframes blink-green {
            0%, 100% { background-color: rgba(34, 197, 94, 0.1); border-color: #22c55e; }
            50% { background-color: #22c55e; border-color: #166534; color: white; }
        }
        .active-blink { animation: blink-green 1s infinite; z-index: 10; }
        .active-blink a, .active-blink span { color: inherit !important; }
        
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen font-sans p-4 md:p-8">

    <div class="max-w-3xl mx-auto relative">
        <!-- Botón Configuración -->
        <button onclick="toggleSettings()" class="absolute -top-2 -right-2 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold mb-2">Tab Scheduler</h1>
            <p class="opacity-70 text-sm text-gray-500">Gestión avanzada de navegación</p>
        </header>

        <!-- Modal Opciones -->
        <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div class="card w-full max-w-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Opciones</h2>
                    <button onclick="toggleSettings()" class="text-2xl">&times;</button>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span>Modo Oscuro</span>
                        <input type="checkbox" id="dark-mode-check" onchange="updateDarkMode()" class="w-5 h-5">
                    </div>
                    <div class="flex items-center justify-between">
                        <span>Sonido (Beep)</span>
                        <input type="checkbox" id="sound-check" onchange="updateSound()" class="w-5 h-5">
                    </div>
                    <hr class="opacity-20">
                    <div class="flex flex-col gap-2">
                        <button onclick="exportCSV()" class="btn-primary bg-emerald-600 hover:bg-emerald-700">Exportar CSV</button>
                        <label class="btn-primary bg-amber-600 hover:bg-amber-700 text-center cursor-pointer">
                            Importar CSV
                            <input type="file" id="csv-file" class="hidden" accept=".csv" onchange="importCSV(event)">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Añadir -->
        <details class="mb-6 group" open>
            <summary class="card flex justify-between items-center select-none group-open:rounded-b-none border-b-0">
                <h2 class="text-xl font-bold">➕ Añadir Nueva Tarea</h2>
                <span class="transition-transform group-open:rotate-180">▼</span>
            </summary>
            <div class="card rounded-t-none border-t-0 bg-gray-50/10">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="url" id="url-input" placeholder="https://ejemplo.com" class="input-field md:col-span-1">
                    <input type="number" id="interval-input" placeholder="Minutos" min="1" class="input-field md:col-span-1">
                    <button onclick="addTask()" class="btn-primary">Programar</button>
                </div>
            </div>
        </details>

        <!-- Lista -->
        <details class="group" open>
            <summary class="card flex justify-between items-center select-none group-open:rounded-b-none border-b-0">
                <h2 class="text-xl font-bold">📋 Tareas Configuradas</h2>
                <span class="transition-transform group-open:rotate-180">▼</span>
            </summary>
            <div class="card rounded-t-none border-t-0 p-0">
                <div id="tasks-container" class="scroll-area p-6 flex flex-col gap-4"></div>
            </div>
        </details>
    </div>

    <script>
        let tasks = [];
        let config = { dark: false, sound: true };

        window.onload = () => {
            // Cargar Config
            const savedConfig = localStorage.getItem('scheduler_config');
            if (savedConfig) {
                config = JSON.parse(savedConfig);
                document.getElementById('dark-mode-check').checked = config.dark;
                document.getElementById('sound-check').checked = config.sound;
                if (config.dark) document.documentElement.classList.add('dark');
            }

            // Cargar Tareas
            const savedTasks = localStorage.getItem('scheduled_tasks');
            if (savedTasks) {
                tasks = JSON.parse(savedTasks).map(t => ({
                    ...t,
                    nextRun: Date.now() + (t.interval * 60000),
                    isFiring: false
                }));
                renderTasks();
            }
            setInterval(checkTasks, 1000);
        };

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function updateDarkMode() {
            config.dark = document.getElementById('dark-mode-check').checked;
            document.documentElement.classList.toggle('dark', config.dark);
            saveConfig();
        }

        function updateSound() {
            config.sound = document.getElementById('sound-check').checked;
            saveConfig();
        }

        function saveConfig() {
            localStorage.setItem('scheduler_config', JSON.stringify(config));
        }

        function addTask() {
            const urlInput = document.getElementById('url-input');
            const intervalInput = document.getElementById('interval-input');
            let url = urlInput.value.trim();
            const interval = parseInt(intervalInput.value);
            if (!url || isNaN(interval) || interval < 1) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            tasks.push({ id: Date.now(), url: url, interval: interval, nextRun: Date.now() + (interval * 60000), isFiring: false });
            saveAndRender();
            urlInput.value = '';
        }

        function checkTasks() {
            const now = Date.now();
            let stateChanged = false;
            tasks.forEach(task => {
                if (now >= task.nextRun && !task.isFiring) {
                    triggerTask(task);
                    stateChanged = true;
                }
            });
            if (stateChanged) saveAndRender();
            else updateTimers();
        }

        function triggerTask(task) {
            window.open(task.url, '_blank');
            task.nextRun = Date.now() + (task.interval * 60000);
            task.isFiring = true;
            
            if ("vibrate" in navigator) navigator.vibrate([200, 100, 200, 100, 200]);
            if (config.sound) playBeep();

            renderTasks();
            setTimeout(() => { task.isFiring = false; renderTasks(); }, 20000);
        }

        function playBeep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        function removeTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('scheduled_tasks', JSON.stringify(tasks.map(t => ({...t, isFiring: false}))));
            renderTasks();
        }

        function updateTimers() {
            tasks.forEach(task => {
                const el = document.getElementById(`timer-${task.id}`);
                if (el) {
                    const timeLeft = Math.max(0, Math.floor((task.nextRun - Date.now()) / 1000));
                    el.innerText = `${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
                }
            });
        }

        function exportCSV() {
            let csv = "url,interval\n" + tasks.map(t => `${t.url},${t.interval}`).join("\n");
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'scheduler_tasks.csv');
            a.click();
        }

        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const lines = event.target.result.split('\n');
                lines.slice(1).forEach(line => {
                    const [url, interval] = line.split(',');
                    if (url && interval) {
                        tasks.push({ id: Date.now() + Math.random(), url: url.trim(), interval: parseInt(interval), nextRun: Date.now() + (parseInt(interval) * 60000), isFiring: false });
                    }
                });
                saveAndRender();
            };
            reader.readAsText(file);
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = tasks.length === 0 ? '<p class="text-center opacity-50 py-4 italic text-sm">No hay tareas</p>' : '';
            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-4 border rounded-lg transition-all ${task.isFiring ? 'active-blink' : 'border-gray-200'}`;
                div.innerHTML = `
                    <div class="flex-1 min-w-0 pr-4">
                        <a href="${task.url}" target="_blank" class="font-bold text-blue-500 hover:underline break-all block">${task.url}</a>
                        <div class="flex items-center gap-4 mt-1 text-xs uppercase font-semibold opacity-70">
                            <span>${task.interval}m</span>
                            <span>Próximo: <span id="timer-${task.id}" class="font-mono">--:--</span></span>
                        </div>
                    </div>
                    <button onclick="removeTask(${task.id})" class="text-red-400 hover:scale-110 p-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>`;
                container.appendChild(div);
            });
            updateTimers();
        }
    </script>
</body>
</html>
